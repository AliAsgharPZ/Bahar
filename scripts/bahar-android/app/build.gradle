// ماژول اپلیکیشن اندروید بهار — بدون هیچ وابستگی بیرونی
// (نیازی به androidx یا material نیست؛ دانلود از dl.google.com هم لازم نمی‌شود)
plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.bahar.school'
    compileSdk 34

    defaultConfig {
        applicationId "ir.bahar.school"
        minSdk 24          // اندروید ۷ به بالا
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// عمداً خالی — اپ فقط WebView پلتفرم استاندورد را استفاده می‌کند.
dependencies {
}
